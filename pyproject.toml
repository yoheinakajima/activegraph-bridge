[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "activegraph-bridge"
version = "0.1.0"
description = "Wrap any existing agent in an ActiveGraph execution membrane: recorded effects, honest replay, verification, and forking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "ActiveGraph contributors" }]
keywords = [
    "agents",
    "activegraph",
    "replay",
    "record-replay",
    "event-sourcing",
    "observability",
    "fork",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["activegraph>=1.10,<2"]

[project.optional-dependencies]
dev = [
    "build>=1",
    "coverage>=7",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/yoheinakajima/activegraph-bridge"
Issues = "https://github.com/yoheinakajima/activegraph-bridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/activegraph_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src/activegraph_bridge"]
check_untyped_defs = true
ignore_missing_imports = true
